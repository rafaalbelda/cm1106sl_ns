text_sensor:
  - platform: homeassistant
    id: ha_weather_condition
    entity_id: weather.aemet
    on_value:
      then:
        - if:
            condition:
              lambda: |-
                return x.empty() || x == "unknown" || x == "unavailable";
            then:
              - if:
                  condition:
                    lambda: |-
                      return !id(ha_weather_openweathermap_condition).state.empty()
                        && id(ha_weather_openweathermap_condition).state != "unknown"
                        && id(ha_weather_openweathermap_condition).state != "unavailable";
                  then:
                    - globals.set:
                        id: active_weather_provider
                        value: '2'
                    - lvgl.label.update:
                        id: lvgl_weather_provider_p4
                        text: "OpenWeather"
                    - lvgl.widget.show: [lvgl_weather_icon_p4, lvgl_weather_temp_p4, lvgl_weather_condition_p4, lvgl_weather_feels_title_p4, lvgl_weather_feels_p4, lvgl_weather_humidity_title_p4, lvgl_weather_humidity_p4]
                    - lvgl.widget.hide: [lvgl_weather_max_title_p4, lvgl_weather_max_p4, lvgl_weather_min_title_p4, lvgl_weather_min_p4, lvgl_weather_rain_title_p4, lvgl_weather_rain_p4]
                    - lvgl.label.update:
                        id: lvgl_weather_temp_p4
                        text:
                          format: "%.1f°C"
                          args: [ 'id(ha_weather_openweathermap_temperature).state' ]
                          if_nan: "--"
                    - lvgl.label.update:
                        id: lvgl_weather_feels_p4
                        text:
                          format: "%.0f°C"
                          args: [ 'id(ha_weather_openweathermap_apparent_temperature).state' ]
                          if_nan: "--"
                    - lvgl.label.update:
                        id: lvgl_weather_humidity_p4
                        text:
                          format: "%.0f%%"
                          args: [ 'id(ha_weather_openweathermap_humidity).state' ]
                          if_nan: "--"
                    - lvgl.label.update:
                        id: lvgl_weather_condition_p4
                        text: !lambda |-
                          auto condition = id(ha_weather_openweathermap_condition).state;
                          if (condition == "sunny") return std::string("Soleado");
                          if (condition == "partlycloudy") return std::string("Intervalos");
                          if (condition == "cloudy") return std::string("Nublado");
                          if (condition == "rainy") return std::string("Lluvia");
                          if (condition == "pouring") return std::string("Lluvia fuerte");
                          if (condition == "lightning" || condition == "lightning-rainy") return std::string("Tormenta");
                          if (condition == "snowy") return std::string("Nieve");
                          if (condition == "fog") return std::string("Niebla");
                          if (condition == "windy" || condition == "windy-variant") return std::string("Viento");
                          if (condition == "clear-night") return std::string("Despejado");
                          return condition;
                    - lvgl.label.update:
                        id: lvgl_weather_icon_p4
                        text: !lambda |-
                          auto condition = id(ha_weather_openweathermap_condition).state;
                          if (condition == "sunny" || condition == "clear-night") return "\U000F0599";
                          if (condition == "partlycloudy") return "\U000F0595";
                          if (condition == "cloudy") return "\U000F0590";
                          if (condition == "rainy") return "\U000F0597";
                          if (condition == "pouring") return "\U000F0596";
                          if (condition == "lightning" || condition == "lightning-rainy") return "\U000F0593";
                          if (condition == "snowy") return "\U000F0598";
                          if (condition == "fog") return "\U000F0591";
