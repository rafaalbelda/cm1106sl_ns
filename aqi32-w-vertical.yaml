                    if (v < 0.0f) return 128;
                    if (v < 400.0f) v = 400.0f;
                    if (v > 2000.0f) v = 2000.0f;
                    return (int) (128.0f - ((v - 400.0f) * 88.0f / 1600.0f));
                - x: 116
                  y: !lambda |-
                    float v = id(co2_history)[4];
                    if (v < 0.0f) return 128;
                    if (v < 400.0f) v = 400.0f;
                    if (v > 2000.0f) v = 2000.0f;
                    return (int) (128.0f - ((v - 400.0f) * 88.0f / 1600.0f));
                - x: 137
                  y: !lambda |-
                    float v = id(co2_history)[5];
                    if (v < 0.0f) return 128;
                    if (v < 400.0f) v = 400.0f;
                    if (v > 2000.0f) v = 2000.0f;
                    return (int) (128.0f - ((v - 400.0f) * 88.0f / 1600.0f));
                - x: 158
                  y: !lambda |-
                    float v = id(co2_history)[6];
                    if (v < 0.0f) return 128;
                    if (v < 400.0f) v = 400.0f;
                    if (v > 2000.0f) v = 2000.0f;
                    return (int) (128.0f - ((v - 400.0f) * 88.0f / 1600.0f));
                - x: 179
                  y: !lambda |-
                    float v = id(co2_history)[7];
                    if (v < 0.0f) return 128;
                    if (v < 400.0f) v = 400.0f;
                    if (v > 2000.0f) v = 2000.0f;
                    return (int) (128.0f - ((v - 400.0f) * 88.0f / 1600.0f));
                - x: 200
                  y: !lambda |-
