display:
#   - platform: ili9xxx
#     model: ili9342
#     cs_pin: 4
#     dc_pin: 2
#     reset_pin: 0
#     invert_colors: true
# #    dimensions: 240x320
#     color_palette: 8BIT
#     rotation: 0

  - platform: ili9xxx
    id: my_display1
    model: ili9342
    cs_pin: 4
    dc_pin: 2
    reset_pin: 0
    color_palette: 8BIT
    invert_colors: false
    #update_interval: 20s
    auto_clear_enabled: false
    #show_test_card: true
    ## 90 degrees - use swap_xy with mirror_x
    ## 180 degrees - use mirror_x with mirror_y
    ## 270 degrees - use swap_xy with mirror_y
    ## With 90 and 270 rotations you will also need to swap the dimensions ‘’height’’ and ‘’width’’
    ## normal: height 320, width 240
    # transform:
    #   mirror_x: false
    #   mirror_y: true
    # dimensions:
    #   height: 320
    #   width: 240
    ## Vertical orientation (240x320)
    transform:
      swap_xy: false
      mirror_x: true
      mirror_y: false
    dimensions:
      height: 320
      width: 240
