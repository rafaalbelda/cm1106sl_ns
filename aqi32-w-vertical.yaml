binary_sensor:
  - platform: gpio
    pin:
        number: GPIO14
        mode: INPUT_PULLUP
        inverted: true
    name: "Cambio Pantalla"
    id: toggle_display
    on_press:
      then:
      - select.next:
          id: display_page
          cycle: true

button:
  - platform: template
    name: "Botón"
    on_press:
      then:
      - select.next:
          id: display_page
          cycle: true
  - platform: template
    name: "Instalar pantalla horizontal"
    icon: "mdi:monitor"
    on_press:
      - ota.http_request.flash:
          url: http://192.168.1.250:8123/local/firmware/firmware-horizontal.ota.bin
          md5_url: http://192.168.1.250:8123/local/firmware/firmware-horizontal.md5
  - platform: template
    name: "Instalar pantalla vertical"
    icon: "mdi:cellphone"
    on_press:
      - ota.http_request.flash:
          url: http://192.168.1.250:8123/local/firmware/firmware-vertical.ota.bin
          md5_url: http://192.168.1.250:8123/local/firmware/firmware-vertical.md5

select:
  - platform: template
    name: "Página de pantalla"
    id: display_page
    icon: "mdi:view-dashboard"
    optimistic: true
    initial_option: "Calidad del aire"
    options:
      - "Calidad del aire"
      - "Resumen"
      - "Ventilación"
      - "Partículas"
      - "CO2"
      - "VOC y NOx"
      - "Comparación AQI"
      - "Tiempo"
    set_action:
      - if:
          condition:
            lambda: 'return x == "Calidad del aire";'
          then:
            - lvgl.page.show:
                id: lvgl_page1
                animation: OUT_RIGHT
                time: 300ms
      - if:
          condition:
            lambda: 'return x == "Resumen";'
          then:
            - lvgl.page.show:
                id: lvgl_page_overview
                animation: OUT_LEFT
                time: 300ms
      - if:
          condition:
            lambda: 'return x == "Ventilación";'
          then:
            - lvgl.page.show:
                id: lvgl_page_rows
                animation: OUT_LEFT
                time: 300ms
      - if:
          condition:
            lambda: 'return x == "Partículas";'
          then:
            - lvgl.page.show:
                id: lvgl_page2
                animation: OUT_LEFT
                time: 300ms
      - if:
          condition:
            lambda: 'return x == "CO2";'
          then:
            - lvgl.page.show:
                id: lvgl_page3
                animation: OUT_LEFT
                time: 300ms
      - if:
          condition:
            lambda: 'return x == "VOC y NOx";'
          then:
            - lvgl.page.show:
                id: lvgl_page4
                animation: OUT_LEFT
                time: 300ms
      - if:
          condition:
            lambda: 'return x == "Comparación AQI";'
          then:
            - lvgl.page.show:
                id: lvgl_page_aqi_compare
                animation: OUT_LEFT
                time: 300ms
      - if:
          condition:
            lambda: 'return x == "Tiempo";'
          then:
            - lvgl.page.show:
                id: lvgl_page5
                animation: OUT_LEFT
                time: 300ms

number:
  - platform: template
    name: "Offset temperatura"
    id: temperature_offset
    optimistic: true
    restore_value: true
    initial_value: -5.0
    min_value: -20.0
    max_value: 20.0
    step: 0.1
    unit_of_measurement: "°C"
    mode: box

# Define a PWM output on the ESP32
output:
  - platform: ledc
    pin: GPIO15
    id: backlight_pwm

# Define a monochromatic, dimmable light for the backlight
light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: back_light
    restore_mode: ALWAYS_ON


