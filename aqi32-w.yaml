binary_sensor:
  - platform: gpio
    pin: 
        number: GPIO14
        mode: INPUT_PULLUP
        inverted: true
    name: "Cambio Pantalla"
    id: toggle_display
    on_press:
      then:
      - lvgl.page.next:
          animation: OUT_LEFT
          time: 300ms

button:
  - platform: template
    name: "Botón"
    on_press:
      then:
      - lvgl.page.next:
          animation: OUT_LEFT
          time: 300ms

number:
  - platform: template
    name: "Offset temperatura"
    id: temperature_offset
    optimistic: true
    restore_value: true
    initial_value: -5.0
    min_value: -20.0
    max_value: 20.0
    step: 0.1
    unit_of_measurement: "°C"
    mode: box

# Define a PWM output on the ESP32
output:
  - platform: ledc
    pin: GPIO15
    id: backlight_pwm

# Define a monochromatic, dimmable light for the backlight
light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: back_light
    restore_mode: ALWAYS_ON


