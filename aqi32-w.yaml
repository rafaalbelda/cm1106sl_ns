text_sensor:
  - platform: homeassistant
    id: ha_weather_condition
    entity_id: weather.aemet
    on_value:
      then:
        - if:
            condition:
              lambda: |-
                return x.empty() || x == "unknown" || x == "unavailable";
            then:
              - if:
                  condition:
                    lambda: |-
                      return !id(ha_weather_openweathermap_condition).state.empty()
                        && id(ha_weather_openweathermap_condition).state != "unknown"
                        && id(ha_weather_openweathermap_condition).state != "unavailable";
                  then:
                    - globals.set:
                        id: active_weather_provider
                        value: '2'
                    - lvgl.label.update:
                        id: lvgl_weather_provider_p4
