                    float v = id(co2_history)[0];
                    if (v < 0.0f) return 96;
                    if (v < 400.0f) v = 400.0f;
                    if (v > 2000.0f) v = 2000.0f;
                    return (int) (96.0f - ((v - 400.0f) * 66.0f / 1600.0f));
