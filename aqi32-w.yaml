                          auto condition = id(ha_weather_openweathermap_condition).state;
                          if (condition == "sunny") return std::string("Soleado");
                          if (condition == "partlycloudy") return std::string("Intervalos");
                          if (condition == "cloudy") return std::string("Nublado");
                          if (condition == "rainy") return std::string("Lluvia");
                          if (condition == "pouring") return std::string("Lluvia fuerte");
                          if (condition == "lightning" || condition == "lightning-rainy") return std::string("Tormenta");
                          if (condition == "snowy") return std::string("Nieve");
                          if (condition == "fog") return std::string("Niebla");
                          if (condition == "windy" || condition == "windy-variant") return std::string("Viento");
                          if (condition == "clear-night") return std::string("Despejado");
                          return condition;
                    - lvgl.label.update:
