                    text: "Aceptable"
                - lvgl.widget.update:
                    id: [lvgl_co2_card, lvgl_co2_row_card, lvgl_co2_card_p_overview, lvgl_co2_card_p3]
                    bg_color: 0x2B2815
                    border_color: 0xF8D64E
                - lvgl.widget.update:
