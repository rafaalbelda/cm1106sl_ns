  #         lambda: 'return (0 == client_info.find("Home Assistant "));'
  #       then:
  #         - lvgl.widget.hide: lbl_hastatus

ota:
  - platform: esphome
    password: "b1aea7cd2f9fe0b199583633ee38d4fd"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Airq32-W2 Fallback Hotspot"
    password: "PTi8ZbbmVD57"

captive_portal:

uart:
  - id: uart_pm
    rx_pin: 16
    tx_pin: 17
    baud_rate: 9600
    rx_timeout: 10
  #  debug:
  - id: uart_cm
    rx_pin: 33
    tx_pin: 32
    baud_rate: 9600
  #  debug:

i2c:
  - id: i2c_main
    sda: GPIO21
    scl: GPIO22
    scan: true

spi:
  - id: spi_bus
    clk_pin: 18
    mosi_pin: 23
    #miso_pin: 19

sensor:

  - platform: sgp4x
    voc:
      name: "VOC Index"
    nox:
      name: "NOx Index"

    compensation:
      humidity_source: my_humidity
      temperature_source: my_temperature

  # - platform: cm1106
  #   uart_id: uart_cm
  #   co2:
  #     name: CO2
  - platform: cm1106sl_ns
    id: my_co2
    uart_id: uart_cm
    update_interval: 60s
    config_period: 60
    smoothing_samples: 2
    abc_active: true
    abc_cycle_days: 7
    abc_baseline: 400
    co2:
      name: "CO2 Level"
      id: co2

  - platform: bme280_i2c
    i2c_id: i2c_main
    address: 0x76
    temperature:
      name: "Temperatura"
      id: my_temperature

    pressure:
      name: "Presión"
      id: my_pressure

    humidity:
      name: "Humedad"
      id: my_humidity
    update_interval: 60s  # Synchronized with CO2 sensor 

  - platform: absolute_humidity
    name: Absolute Humidity
    temperature: my_temperature
    humidity: my_humidity

  - platform: pmsx003
    uart_id: uart_pm
    type: PMSX003
    
    # pm_1_0_std:
    #   name: "PM1.0 std"

    # pm_2_5_std:
    #   name: "PM2.5 std"

    # pm_10_0_std:
    #   name: "PM10.0 std"

    pm_1_0:
      name: "PM1.0"
      id: pm1_sensor

    pm_2_5:
      name: "PM2.5"
      id: pm25_sensor

    pm_10_0:
      name: "PM10"
      id: pm10_sensor

    update_interval: 60s  # Synchronized with other sensors

  - platform: aqi
    name: "European Air Quality Index"
    pm_2_5: pm25_sensor
    pm_10_0: pm10_sensor
    calculation_type: CAQI
    id: euaqi

  - platform: homeassistant
    id: ha_weather_temperature
    entity_id: weather.aemet
    attribute: temperature

  - platform: homeassistant
    id: ha_weather_apparent_temperature
    entity_id: sensor.aemet_temperature_feeling

  - platform: homeassistant
    id: ha_weather_temperature_high
    entity_id: sensor.aemet_daily_forecast_temperature

  - platform: homeassistant
    id: ha_weather_temperature_low
    entity_id: sensor.aemet_daily_forecast_temperature_low

  - platform: homeassistant
    id: ha_weather_precipitation_probability
    entity_id: sensor.aemet_daily_forecast_precipitation_probability

  - platform: homeassistant
    id: ha_weather_humidity
    entity_id: weather.aemet
    attribute: humidity

text_sensor:
  - platform: homeassistant
    id: ha_weather_condition
    entity_id: weather.aemet

binary_sensor:
  - platform: gpio
    pin: 
        number: GPIO14
        mode: INPUT_PULLUP
        inverted: true
    name: "Button"
    id: toggle_display
    on_press:
      then:
      - display.page.show_next: my_display


