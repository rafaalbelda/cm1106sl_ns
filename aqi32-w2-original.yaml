esp32:
  board: az-delivery-devkit-v4
  framework:
    type: esp-idf

# Enable logging
logger:
#  level: VERBOSE

# Enable Home Assistant API
api:
  encryption:
    key: "Fwy7bN2zDEjkCnrFapHhqnEElSg573EZ0Y8NO549x6A="

  # on_client_connected:
  #   - wait_until:
  #       condition:
  #         api.connected:
  #           state_subscription_only: true
  #   - lvgl.widget.show: lbl_hastatus
  # on_client_disconnected:
  #   - if:
