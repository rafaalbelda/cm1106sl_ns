esphome:
  name: airq32-w2
  friendly_name: AirQ32-W2
  on_boot:
    - delay: 5s

external_components:
  - source: github://rafaalbelda/cm1106sl_ns@uart
    components: [cm1106sl_ns]
    refresh: 1h

esp32:
  board: az-delivery-devkit-v4
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "Fwy7bN2zDEjkCnrFapHhqnEElSg573EZ0Y8NO549x6A="

ota:
  - platform: esphome
    password: "b1aea7cd2f9fe0b199583633ee38d4fd"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Airq32-W2 Fallback Hotspot"
    password: "PTi8ZbbmVD57"

captive_portal:

uart:
  - id: uart_pm
    rx_pin: 16
    tx_pin: 17
    baud_rate: 9600
    rx_timeout: 10
  - id: uart_cm
    rx_pin: 33
    tx_pin: 32
    baud_rate: 9600

i2c:
  - id: i2c_main
    sda: GPIO21
    scl: GPIO22
    scan: true

sensor:
  - platform: sgp4x
    voc:
      name: "VOC Index"
      id: voc_index
      on_value:
        then:
          - lvgl.label.update:
              id: lbl_voc
              text:
                format: "%.0f"
                args: [ 'x' ]
                if_nan: "--"
          - lambda: |-
              if (std::isnan(x)) {
                lv_label_set_text(id(lbl_voc_status), "--");
              } else if (x < 97) {
                lv_label_set_text(id(lbl_voc_status), "GOOD");
              } else if (x <= 102) {
                lv_label_set_text(id(lbl_voc_status), "OK");
              } else {
                lv_label_set_text(id(lbl_voc_status), "BAD");
              }
    nox:
      name: "NOx Index"
      id: nox_index
      on_value:
        then:
          - lvgl.label.update:
              id: lbl_nox
              text:
                format: "%.0f"
                args: [ 'x' ]
                if_nan: "--"
          - lambda: |-
              if (std::isnan(x)) {
                lv_label_set_text(id(lbl_nox_status), "--");
              } else if (x < 2) {
                lv_label_set_text(id(lbl_nox_status), "GOOD");
              } else if (x < 50) {
                lv_label_set_text(id(lbl_nox_status), "OK");
              } else if (x <= 500) {
                lv_label_set_text(id(lbl_nox_status), "KO");
              } else {
                lv_label_set_text(id(lbl_nox_status), "BAD");
              }

    compensation:
      humidity_source: my_humidity
      temperature_source: my_temperature

  - platform: cm1106sl_ns
    id: my_co2
    uart_id: uart_cm
    update_interval: 60s
    config_period: 60
    smoothing_samples: 2
    abc_active: true
    abc_cycle_days: 7
    abc_baseline: 400
    co2:
      name: "CO2 Level"
      id: co2
      on_value:
        then:
          - lvgl.label.update:
              id: lbl_co2
              text:
                format: "%.0f"
                args: [ 'x' ]
                if_nan: "--"
          - lambda: |-
              if (std::isnan(x)) {
                lv_label_set_text(id(lbl_co2_status), "--");
              } else if (x < 600) {
                lv_label_set_text(id(lbl_co2_status), "GOOD");
              } else if (x < 1000) {
                lv_label_set_text(id(lbl_co2_status), "OK");
              } else if (x <= 2000) {
                lv_label_set_text(id(lbl_co2_status), "KO");
              } else {
                lv_label_set_text(id(lbl_co2_status), "BAD");
              }

  - platform: bme280_i2c
    i2c_id: i2c_main
    address: 0x76
    temperature:
      name: "Temperatura"
      id: my_temperature
      on_value:
        then:
          - lvgl.label.update:
              id: lbl_temp
              text:
                format: "%.1f°C"
                args: [ 'x' ]
                if_nan: "--"

    pressure:
      name: "Presión"
      id: my_pressure
      on_value:
        then:
          - lvgl.label.update:
              id: lbl_pressure
              text:
                format: "%.0f"
                args: [ 'x' ]
                if_nan: "--"

    humidity:
      name: "Humedad"
      id: my_humidity
      on_value:
        then:
          - lvgl.label.update:
              id: lbl_humidity
              text:
                format: "%.1f%"
                args: [ 'x' ]
                if_nan: "--"
    update_interval: 60s

  - platform: absolute_humidity
    name: Absolute Humidity
    temperature: my_temperature
    humidity: my_humidity

  - platform: pmsx003
    uart_id: uart_pm
    type: PMSX003
    pm_1_0:
      name: "PM1.0"
      id: pm1_sensor
      on_value:
        then:
          - lvgl.label.update:
              id: lbl_pm1
              text:
                format: "%.0f"
                args: [ 'x' ]
                if_nan: "--"

    pm_2_5:
      name: "PM2.5"
      id: pm25_sensor
      on_value:
        then:
          - lvgl.label.update:
              id: lbl_pm25
              text:
                format: "%.0f"
                args: [ 'x' ]
                if_nan: "--"

    pm_10_0:
      name: "PM10"
      id: pm10_sensor
      on_value:
        then:
          - lvgl.label.update:
              id: lbl_pm10
              text:
                format: "%.0f"
                args: [ 'x' ]
                if_nan: "--"

    update_interval: 60s

  - platform: aqi
    name: "European Air Quality Index"
    pm_2_5: pm25_sensor
    pm_10_0: pm10_sensor
    calculation_type: CAQI
    id: euaqi
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_aqi_1
            text:
              format: "%.0f"
              args: [ 'x' ]
              if_nan: "--"
        - lambda: |-
            if (std::isnan(x)) {
              lv_label_set_text(id(lbl_aqi_1_status), "--");
              lv_label_set_text(id(lbl_aqi_2_status), "--");
            } else if (x < 50) {
              lv_label_set_text(id(lbl_aqi_1_status), "GOOD");
              lv_label_set_text(id(lbl_aqi_2_status), "GOOD");
            } else if (x < 75) {
              lv_label_set_text(id(lbl_aqi_1_status), "OK");
              lv_label_set_text(id(lbl_aqi_2_status), "OK");
            } else if (x <= 100) {
              lv_label_set_text(id(lbl_aqi_1_status), "BAD");
              lv_label_set_text(id(lbl_aqi_2_status), "BAD");
            } else {
              lv_label_set_text(id(lbl_aqi_1_status), "VBAD");
              lv_label_set_text(id(lbl_aqi_2_status), "VBAD");
            }
        - lvgl.label.update:
            id: lbl_aqi_2
            text:
              format: "%.0f"
              args: [ 'x' ]
              if_nan: "--"

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO14
      mode: INPUT_PULLUP
      inverted: true
    name: "Button"
    id: toggle_display
    on_press:
      then:
        - lvgl.page.next

font:
  - file: "gfonts://Roboto"
    id: font10
    size: 10
  - file: "gfonts://Roboto"
    id: font16
    size: 16

display:
  - platform: ssd1306_i2c
    i2c_id: i2c_main
    model: "SSD1306 128x64"
    id: my_display
    auto_clear_enabled: false
    update_interval: 1s

