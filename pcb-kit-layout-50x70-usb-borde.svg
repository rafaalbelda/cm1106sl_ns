<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #172033; }
      .sub { font: 16px Arial, sans-serif; fill: #4b5563; }
      .label { font: 700 15px Arial, sans-serif; fill: #172033; }
      .small { font: 12px Arial, sans-serif; fill: #374151; }
      .pin { font: 11px Consolas, monospace; fill: #111827; }
      .board { fill: #eef7ef; stroke: #234d20; stroke-width: 3; }
      .case { fill: none; stroke: #64748b; stroke-width: 3; stroke-dasharray: 12 7; }
      .lid { fill: #f8fafc; stroke: #475569; stroke-width: 3; stroke-dasharray: 10 6; }
      .hole { fill: #d6ead7; stroke: #9bbb9b; stroke-width: 1; }
      .module { stroke: #111827; stroke-width: 2; rx: 8; ry: 8; }
      .screen { fill: #1f2937; stroke: #111827; stroke-width: 2; }
      .wire5 { stroke: #d97706; stroke-width: 3; fill: none; }
      .wire33 { stroke: #16a34a; stroke-width: 3; fill: none; }
      .wireg { stroke: #111827; stroke-width: 3; fill: none; }
      .wireuart1 { stroke: #2563eb; stroke-width: 3; fill: none; }
      .wireuart2 { stroke: #dc2626; stroke-width: 3; fill: none; }
      .wirei2c { stroke: #7c3aed; stroke-width: 3; fill: none; }
      .wirespi { stroke: #0891b2; stroke-width: 3; fill: none; }
      .wirectrl { stroke: #be123c; stroke-width: 3; fill: none; }
      .ribbon { stroke: #64748b; stroke-width: 18; fill: none; opacity: 0.28; }
      .legend { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; rx: 8; ry: 8; }
      .warn { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; rx: 8; ry: 8; }
      .cut { fill: #e2e8f0; stroke: #334155; stroke-width: 2; }
    </style>
  </defs>

  <text x="50" y="45" class="title">AirQ32-W - PCB 50 x 70 mm con USB del ESP32 al borde de caja</text>
  <text x="50" y="72" class="sub">Vista superior orientativa. La PCB compacta actua como placa controladora; PMSA003 y TFT van montados en caja/tapa.</text>

  <!-- Case outline -->
  <rect x="55" y="110" width="760" height="760" class="case"/>
  <text x="65" y="102" class="small">Caja, vista interior. El recorte USB queda alineado con el conector del ESP32.</text>

  <!-- 50 x 70 board, scaled 8 px/mm -->
  <rect x="165" y="220" width="400" height="560" class="board"/>
  <text x="170" y="210" class="label">PCB 50 x 70 mm</text>

  <!-- board perf grid -->
  <g opacity="0.62">
    <circle cx="185" cy="245" r="3" class="hole"/><circle cx="225" cy="245" r="3" class="hole"/><circle cx="265" cy="245" r="3" class="hole"/><circle cx="305" cy="245" r="3" class="hole"/><circle cx="345" cy="245" r="3" class="hole"/><circle cx="385" cy="245" r="3" class="hole"/><circle cx="425" cy="245" r="3" class="hole"/><circle cx="465" cy="245" r="3" class="hole"/><circle cx="505" cy="245" r="3" class="hole"/><circle cx="545" cy="245" r="3" class="hole"/>
    <circle cx="185" cy="305" r="3" class="hole"/><circle cx="225" cy="305" r="3" class="hole"/><circle cx="265" cy="305" r="3" class="hole"/><circle cx="305" cy="305" r="3" class="hole"/><circle cx="345" cy="305" r="3" class="hole"/><circle cx="385" cy="305" r="3" class="hole"/><circle cx="425" cy="305" r="3" class="hole"/><circle cx="465" cy="305" r="3" class="hole"/><circle cx="505" cy="305" r="3" class="hole"/><circle cx="545" cy="305" r="3" class="hole"/>
    <circle cx="185" cy="365" r="3" class="hole"/><circle cx="225" cy="365" r="3" class="hole"/><circle cx="265" cy="365" r="3" class="hole"/><circle cx="305" cy="365" r="3" class="hole"/><circle cx="345" cy="365" r="3" class="hole"/><circle cx="385" cy="365" r="3" class="hole"/><circle cx="425" cy="365" r="3" class="hole"/><circle cx="465" cy="365" r="3" class="hole"/><circle cx="505" cy="365" r="3" class="hole"/><circle cx="545" cy="365" r="3" class="hole"/>
    <circle cx="185" cy="425" r="3" class="hole"/><circle cx="225" cy="425" r="3" class="hole"/><circle cx="265" cy="425" r="3" class="hole"/><circle cx="305" cy="425" r="3" class="hole"/><circle cx="345" cy="425" r="3" class="hole"/><circle cx="385" cy="425" r="3" class="hole"/><circle cx="425" cy="425" r="3" class="hole"/><circle cx="465" cy="425" r="3" class="hole"/><circle cx="505" cy="425" r="3" class="hole"/><circle cx="545" cy="425" r="3" class="hole"/>
    <circle cx="185" cy="485" r="3" class="hole"/><circle cx="225" cy="485" r="3" class="hole"/><circle cx="265" cy="485" r="3" class="hole"/><circle cx="305" cy="485" r="3" class="hole"/><circle cx="345" cy="485" r="3" class="hole"/><circle cx="385" cy="485" r="3" class="hole"/><circle cx="425" cy="485" r="3" class="hole"/><circle cx="465" cy="485" r="3" class="hole"/><circle cx="505" cy="485" r="3" class="hole"/><circle cx="545" cy="485" r="3" class="hole"/>
    <circle cx="185" cy="545" r="3" class="hole"/><circle cx="225" cy="545" r="3" class="hole"/><circle cx="265" cy="545" r="3" class="hole"/><circle cx="305" cy="545" r="3" class="hole"/><circle cx="345" cy="545" r="3" class="hole"/><circle cx="385" cy="545" r="3" class="hole"/><circle cx="425" cy="545" r="3" class="hole"/><circle cx="465" cy="545" r="3" class="hole"/><circle cx="505" cy="545" r="3" class="hole"/><circle cx="545" cy="545" r="3" class="hole"/>
    <circle cx="185" cy="605" r="3" class="hole"/><circle cx="225" cy="605" r="3" class="hole"/><circle cx="265" cy="605" r="3" class="hole"/><circle cx="305" cy="605" r="3" class="hole"/><circle cx="345" cy="605" r="3" class="hole"/><circle cx="385" cy="605" r="3" class="hole"/><circle cx="425" cy="605" r="3" class="hole"/><circle cx="465" cy="605" r="3" class="hole"/><circle cx="505" cy="605" r="3" class="hole"/><circle cx="545" cy="605" r="3" class="hole"/>
    <circle cx="185" cy="665" r="3" class="hole"/><circle cx="225" cy="665" r="3" class="hole"/><circle cx="265" cy="665" r="3" class="hole"/><circle cx="305" cy="665" r="3" class="hole"/><circle cx="345" cy="665" r="3" class="hole"/><circle cx="385" cy="665" r="3" class="hole"/><circle cx="425" cy="665" r="3" class="hole"/><circle cx="465" cy="665" r="3" class="hole"/><circle cx="505" cy="665" r="3" class="hole"/><circle cx="545" cy="665" r="3" class="hole"/>
    <circle cx="185" cy="725" r="3" class="hole"/><circle cx="225" cy="725" r="3" class="hole"/><circle cx="265" cy="725" r="3" class="hole"/><circle cx="305" cy="725" r="3" class="hole"/><circle cx="345" cy="725" r="3" class="hole"/><circle cx="385" cy="725" r="3" class="hole"/><circle cx="425" cy="725" r="3" class="hole"/><circle cx="465" cy="725" r="3" class="hole"/><circle cx="505" cy="725" r="3" class="hole"/><circle cx="545" cy="725" r="3" class="hole"/>
  </g>

  <!-- Rails -->
  <line x1="180" y1="240" x2="550" y2="240" class="wire5"/>
  <line x1="180" y1="262" x2="550" y2="262" class="wire33"/>
  <line x1="180" y1="762" x2="550" y2="762" class="wireg"/>
  <text x="188" y="235" class="small">+5V</text>
  <text x="188" y="257" class="small">+3V3</text>
  <text x="188" y="754" class="small">GND</text>

  <!-- USB cutout at case edge -->
  <rect x="52" y="435" width="42" height="80" class="cut"/>
  <text x="62" y="530" class="small">recorte USB</text>

  <!-- ESP32, scaled approx 28 x 51 mm -->
  <rect x="195" y="300" width="225" height="412" fill="#93c5fd" class="module"/>
  <text x="220" y="330" class="label">ESP32 DevKit V4</text>
  <text x="220" y="350" class="small">girado 90 grados</text>
  <text x="220" y="370" class="small">USB hacia borde de caja</text>
  <rect x="170" y="455" width="55" height="70" fill="#d1d5db" stroke="#111827" stroke-width="2"/>
  <text x="177" y="493" class="small">USB</text>
  <path d="M170 490 L95 490" class="wireg"/>
  <text x="112" y="480" class="small">alinear</text>

  <!-- On board small modules/connectors -->
  <rect x="445" y="300" width="90" height="95" fill="#ddd6fe" class="module"/>
  <text x="459" y="328" class="label">BME280</text>
  <text x="459" y="348" class="small">I2C</text>
  <text x="459" y="370" class="pin">VIN GND SCL SDA</text>

  <rect x="445" y="425" width="92" height="80" fill="#ffffff" class="module"/>
  <text x="461" y="452" class="label">J-TFT</text>
  <text x="454" y="472" class="pin">VCC GND CLK</text>
  <text x="454" y="490" class="pin">MOSI CS DC RST LED</text>

  <rect x="445" y="530" width="92" height="72" fill="#ffffff" class="module"/>
  <text x="459" y="557" class="label">J-PMS</text>
  <text x="454" y="577" class="pin">5V GND RX TX</text>
  <text x="454" y="593" class="pin">SET RST opc.</text>

  <rect x="445" y="625" width="92" height="72" fill="#ffffff" class="module"/>
  <text x="456" y="652" class="label">J-CO2</text>
  <text x="454" y="672" class="pin">5V GND RX TX</text>

  <rect x="445" y="715" width="92" height="35" fill="#fef3c7" class="module"/>
  <text x="458" y="738" class="pin">BTN GPIO14</text>

  <!-- Off-board PMS and CM on case wall -->
  <rect x="590" y="590" width="200" height="180" fill="#e0f2fe" class="module"/>
  <text x="615" y="620" class="label">PMSA003 fuera PCB</text>
  <text x="615" y="642" class="small">atornillado a caja</text>
  <text x="615" y="662" class="small">aire hacia rejilla lateral</text>
  <rect x="760" y="640" width="30" height="65" fill="#bfdbfe" stroke="#111827"/>

  <rect x="585" y="360" width="210" height="90" fill="#fde68a" class="module"/>
  <text x="605" y="390" class="label">CM1106SL-NS fuera PCB</text>
  <text x="605" y="412" class="small">mejor con aire directo</text>
  <text x="605" y="432" class="small">tambien podria ir en J-CO2</text>

  <!-- Lid TFT -->
  <rect x="860" y="110" width="470" height="335" class="lid"/>
  <text x="880" y="140" class="label">Tapa de caja</text>
  <rect x="930" y="180" width="330" height="220" fill="#111827" class="module"/>
  <rect x="970" y="212" width="250" height="150" class="screen"/>
  <text x="990" y="205" class="label" fill="#ffffff">TFT ILI9342</text>
  <text x="982" y="384" class="small" fill="#ffffff">pantalla visible desde fuera</text>
  <rect x="1045" y="408" width="90" height="24" fill="#ffffff" stroke="#111827"/>
  <text x="1058" y="425" class="pin">J-TFT</text>

  <!-- Stylized cables -->
  <path d="M537 465 C690 450 835 410 1045 420" class="ribbon"/>
  <path d="M537 465 C690 450 835 410 1045 420" class="wirespi"/>
  <text x="655" y="438" class="small">mazo corto a tapa</text>

  <path d="M537 565 C565 585 575 640 590 670" class="wireuart1"/>
  <path d="M537 585 C565 610 575 690 590 710" class="wireuart2"/>
  <path d="M537 660 C560 620 565 430 585 405" class="wireuart1"/>
  <path d="M537 680 C565 640 570 445 585 430" class="wireuart2"/>
  <path d="M420 360 C440 345 435 338 445 338" class="wirei2c"/>
  <path d="M420 385 C435 372 435 365 445 365" class="wirei2c"/>
  <path d="M420 505 C435 560 435 720 445 732" class="wirectrl"/>

  <!-- Warning / fit note -->
  <rect x="860" y="475" width="470" height="120" class="warn"/>
  <text x="885" y="510" class="label">Importante de encaje</text>
  <text x="885" y="535" class="small">En 50 x 70 mm no caben ESP32 + PMSA003 + TFT + sensores grandes en la misma PCB.</text>
  <text x="885" y="555" class="small">Esta version usa la PCB compacta como carrier y saca PMS/CO2/TFT a la caja.</text>
  <text x="885" y="575" class="small">El USB queda orientado al recorte para poder programar/alimentar sin abrir la caja.</text>

  <!-- Wiring table -->
  <rect x="860" y="625" width="470" height="245" class="legend"/>
  <text x="885" y="660" class="title">Conexiones</text>
  <text x="885" y="695" class="pin">PMSA003 TX -> GPIO16 RX     PMS RX -> GPIO17 TX</text>
  <text x="885" y="715" class="pin">CM1106 TX  -> GPIO33 RX     CM RX  -> GPIO32 TX</text>
  <text x="885" y="735" class="pin">I2C SDA    -> GPIO21        I2C SCL -> GPIO22</text>
  <text x="885" y="755" class="pin">TFT CLK    -> GPIO18        TFT MOSI -> GPIO23</text>
  <text x="885" y="775" class="pin">TFT CS     -> GPIO4         TFT DC   -> GPIO2</text>
  <text x="885" y="795" class="pin">TFT RESET  -> GPIO0         TFT LED  -> GPIO15</text>
  <text x="885" y="815" class="pin">Boton      -> GPIO14 a GND, INPUT_PULLUP invertido</text>
  <text x="885" y="845" class="small">Usa conectores bloqueados; con la tapa desmontable, deja holgura y alivio de tension.</text>

  <!-- Color key -->
  <rect x="70" y="895" width="1260" height="60" class="legend"/>
  <line x1="95" y1="920" x2="145" y2="920" class="wireuart1"/><text x="155" y="925" class="small">UART RX</text>
  <line x1="230" y1="920" x2="280" y2="920" class="wireuart2"/><text x="290" y="925" class="small">UART TX</text>
  <line x1="365" y1="920" x2="415" y2="920" class="wirei2c"/><text x="425" y="925" class="small">I2C</text>
  <line x1="500" y1="920" x2="550" y2="920" class="wirespi"/><text x="560" y="925" class="small">SPI TFT</text>
  <line x1="650" y1="920" x2="700" y2="920" class="wirectrl"/><text x="710" y="925" class="small">control/backlight/boton</text>
  <text x="870" y="925" class="small">PCB 50 x 70: priorizar conectores en angulo y separadores bajos.</text>
</svg>
