<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #172033; }
      .sub { font: 16px Arial, sans-serif; fill: #4b5563; }
      .label { font: 700 15px Arial, sans-serif; fill: #172033; }
      .small { font: 12px Arial, sans-serif; fill: #374151; }
      .pin { font: 11px Consolas, monospace; fill: #111827; }
      .board { fill: #eef7ef; stroke: #234d20; stroke-width: 3; }
      .lid { fill: #f8fafc; stroke: #475569; stroke-width: 3; stroke-dasharray: 10 6; }
      .hole { fill: #d6ead7; stroke: #9bbb9b; stroke-width: 1; }
      .module { stroke: #111827; stroke-width: 2; rx: 8; ry: 8; }
      .screen { fill: #1f2937; stroke: #111827; stroke-width: 2; }
      .cutout { fill: #0f172a; stroke: #334155; stroke-width: 2; }
      .wire5 { stroke: #d97706; stroke-width: 3; fill: none; }
      .wire33 { stroke: #16a34a; stroke-width: 3; fill: none; }
      .wireg { stroke: #111827; stroke-width: 3; fill: none; }
      .wireuart1 { stroke: #2563eb; stroke-width: 3; fill: none; }
      .wireuart2 { stroke: #dc2626; stroke-width: 3; fill: none; }
      .wirei2c { stroke: #7c3aed; stroke-width: 3; fill: none; }
      .wirespi { stroke: #0891b2; stroke-width: 3; fill: none; }
      .wirectrl { stroke: #be123c; stroke-width: 3; fill: none; }
      .ribbon { stroke: #64748b; stroke-width: 18; fill: none; opacity: 0.35; }
      .legend { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; rx: 8; ry: 8; }
      .note { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1.5; rx: 8; ry: 8; }
    </style>
  </defs>

  <text x="50" y="45" class="title">AirQ32-W - PCB kit con TFT en la tapa de la caja</text>
  <text x="50" y="72" class="sub">Vista superior orientativa: la placa queda dentro de la caja y la pantalla TFT va montada en la tapa, conectada por mazo/cinta.</text>

  <!-- Main internal PCB -->
  <rect x="70" y="115" width="610" height="740" class="board"/>
  <text x="80" y="108" class="small">PCB universal interna, aprox. 80 x 150 mm</text>

  <!-- simplified perf grid -->
  <g opacity="0.62">
    <circle cx="100" cy="145" r="3" class="hole"/><circle cx="130" cy="145" r="3" class="hole"/><circle cx="160" cy="145" r="3" class="hole"/><circle cx="190" cy="145" r="3" class="hole"/><circle cx="220" cy="145" r="3" class="hole"/><circle cx="250" cy="145" r="3" class="hole"/><circle cx="280" cy="145" r="3" class="hole"/><circle cx="310" cy="145" r="3" class="hole"/><circle cx="340" cy="145" r="3" class="hole"/><circle cx="370" cy="145" r="3" class="hole"/><circle cx="400" cy="145" r="3" class="hole"/><circle cx="430" cy="145" r="3" class="hole"/><circle cx="460" cy="145" r="3" class="hole"/><circle cx="490" cy="145" r="3" class="hole"/><circle cx="520" cy="145" r="3" class="hole"/><circle cx="550" cy="145" r="3" class="hole"/><circle cx="580" cy="145" r="3" class="hole"/><circle cx="610" cy="145" r="3" class="hole"/><circle cx="640" cy="145" r="3" class="hole"/>
    <circle cx="100" cy="205" r="3" class="hole"/><circle cx="160" cy="205" r="3" class="hole"/><circle cx="220" cy="205" r="3" class="hole"/><circle cx="280" cy="205" r="3" class="hole"/><circle cx="340" cy="205" r="3" class="hole"/><circle cx="400" cy="205" r="3" class="hole"/><circle cx="460" cy="205" r="3" class="hole"/><circle cx="520" cy="205" r="3" class="hole"/><circle cx="580" cy="205" r="3" class="hole"/><circle cx="640" cy="205" r="3" class="hole"/>
    <circle cx="100" cy="265" r="3" class="hole"/><circle cx="160" cy="265" r="3" class="hole"/><circle cx="220" cy="265" r="3" class="hole"/><circle cx="280" cy="265" r="3" class="hole"/><circle cx="340" cy="265" r="3" class="hole"/><circle cx="400" cy="265" r="3" class="hole"/><circle cx="460" cy="265" r="3" class="hole"/><circle cx="520" cy="265" r="3" class="hole"/><circle cx="580" cy="265" r="3" class="hole"/><circle cx="640" cy="265" r="3" class="hole"/>
    <circle cx="100" cy="325" r="3" class="hole"/><circle cx="160" cy="325" r="3" class="hole"/><circle cx="220" cy="325" r="3" class="hole"/><circle cx="280" cy="325" r="3" class="hole"/><circle cx="340" cy="325" r="3" class="hole"/><circle cx="400" cy="325" r="3" class="hole"/><circle cx="460" cy="325" r="3" class="hole"/><circle cx="520" cy="325" r="3" class="hole"/><circle cx="580" cy="325" r="3" class="hole"/><circle cx="640" cy="325" r="3" class="hole"/>
    <circle cx="100" cy="385" r="3" class="hole"/><circle cx="160" cy="385" r="3" class="hole"/><circle cx="220" cy="385" r="3" class="hole"/><circle cx="280" cy="385" r="3" class="hole"/><circle cx="340" cy="385" r="3" class="hole"/><circle cx="400" cy="385" r="3" class="hole"/><circle cx="460" cy="385" r="3" class="hole"/><circle cx="520" cy="385" r="3" class="hole"/><circle cx="580" cy="385" r="3" class="hole"/><circle cx="640" cy="385" r="3" class="hole"/>
    <circle cx="100" cy="445" r="3" class="hole"/><circle cx="160" cy="445" r="3" class="hole"/><circle cx="220" cy="445" r="3" class="hole"/><circle cx="280" cy="445" r="3" class="hole"/><circle cx="340" cy="445" r="3" class="hole"/><circle cx="400" cy="445" r="3" class="hole"/><circle cx="460" cy="445" r="3" class="hole"/><circle cx="520" cy="445" r="3" class="hole"/><circle cx="580" cy="445" r="3" class="hole"/><circle cx="640" cy="445" r="3" class="hole"/>
    <circle cx="100" cy="505" r="3" class="hole"/><circle cx="160" cy="505" r="3" class="hole"/><circle cx="220" cy="505" r="3" class="hole"/><circle cx="280" cy="505" r="3" class="hole"/><circle cx="340" cy="505" r="3" class="hole"/><circle cx="400" cy="505" r="3" class="hole"/><circle cx="460" cy="505" r="3" class="hole"/><circle cx="520" cy="505" r="3" class="hole"/><circle cx="580" cy="505" r="3" class="hole"/><circle cx="640" cy="505" r="3" class="hole"/>
    <circle cx="100" cy="565" r="3" class="hole"/><circle cx="160" cy="565" r="3" class="hole"/><circle cx="220" cy="565" r="3" class="hole"/><circle cx="280" cy="565" r="3" class="hole"/><circle cx="340" cy="565" r="3" class="hole"/><circle cx="400" cy="565" r="3" class="hole"/><circle cx="460" cy="565" r="3" class="hole"/><circle cx="520" cy="565" r="3" class="hole"/><circle cx="580" cy="565" r="3" class="hole"/><circle cx="640" cy="565" r="3" class="hole"/>
    <circle cx="100" cy="625" r="3" class="hole"/><circle cx="160" cy="625" r="3" class="hole"/><circle cx="220" cy="625" r="3" class="hole"/><circle cx="280" cy="625" r="3" class="hole"/><circle cx="340" cy="625" r="3" class="hole"/><circle cx="400" cy="625" r="3" class="hole"/><circle cx="460" cy="625" r="3" class="hole"/><circle cx="520" cy="625" r="3" class="hole"/><circle cx="580" cy="625" r="3" class="hole"/><circle cx="640" cy="625" r="3" class="hole"/>
    <circle cx="100" cy="685" r="3" class="hole"/><circle cx="160" cy="685" r="3" class="hole"/><circle cx="220" cy="685" r="3" class="hole"/><circle cx="280" cy="685" r="3" class="hole"/><circle cx="340" cy="685" r="3" class="hole"/><circle cx="400" cy="685" r="3" class="hole"/><circle cx="460" cy="685" r="3" class="hole"/><circle cx="520" cy="685" r="3" class="hole"/><circle cx="580" cy="685" r="3" class="hole"/><circle cx="640" cy="685" r="3" class="hole"/>
    <circle cx="100" cy="745" r="3" class="hole"/><circle cx="130" cy="745" r="3" class="hole"/><circle cx="160" cy="745" r="3" class="hole"/><circle cx="190" cy="745" r="3" class="hole"/><circle cx="220" cy="745" r="3" class="hole"/><circle cx="250" cy="745" r="3" class="hole"/><circle cx="280" cy="745" r="3" class="hole"/><circle cx="310" cy="745" r="3" class="hole"/><circle cx="340" cy="745" r="3" class="hole"/><circle cx="370" cy="745" r="3" class="hole"/><circle cx="400" cy="745" r="3" class="hole"/><circle cx="430" cy="745" r="3" class="hole"/><circle cx="460" cy="745" r="3" class="hole"/><circle cx="490" cy="745" r="3" class="hole"/><circle cx="520" cy="745" r="3" class="hole"/><circle cx="550" cy="745" r="3" class="hole"/><circle cx="580" cy="745" r="3" class="hole"/><circle cx="610" cy="745" r="3" class="hole"/><circle cx="640" cy="745" r="3" class="hole"/>
  </g>

  <!-- Power rails -->
  <line x1="95" y1="135" x2="655" y2="135" class="wire5"/>
  <line x1="95" y1="162" x2="655" y2="162" class="wire33"/>
  <line x1="95" y1="830" x2="655" y2="830" class="wireg"/>
  <text x="105" y="129" class="small">+5V</text>
  <text x="105" y="157" class="small">+3V3</text>
  <text x="105" y="822" class="small">GND</text>

  <!-- Internal PCB modules -->
  <rect x="110" y="210" width="215" height="390" fill="#93c5fd" class="module"/>
  <text x="135" y="240" class="label">ESP32 DevKit V4</text>
  <text x="135" y="260" class="small">USB accesible por lateral/caja</text>
  <rect x="180" y="563" width="75" height="28" fill="#d1d5db" stroke="#111827"/>
  <text x="188" y="583" class="small">USB</text>

  <rect x="380" y="190" width="235" height="90" fill="#e0f2fe" class="module"/>
  <text x="405" y="220" class="label">PMSA003</text>
  <text x="405" y="240" class="small">38 x 35 mm, aire hacia lateral</text>
  <rect x="585" y="210" width="30" height="48" fill="#bfdbfe" stroke="#111827"/>

  <rect x="390" y="320" width="210" height="80" fill="#fde68a" class="module"/>
  <text x="410" y="350" class="label">CM1106SL-NS CO2</text>
  <text x="410" y="370" class="small">ventanas hacia rejilla caja</text>

  <rect x="410" y="465" width="80" height="95" fill="#ddd6fe" class="module"/>
  <text x="424" y="493" class="label">BME280</text>
  <text x="424" y="512" class="small">lejos calor</text>
  <text x="424" y="535" class="pin">VIN GND SCL SDA</text>

  <rect x="520" y="455" width="95" height="70" fill="#f3f4f6" class="module"/>
  <text x="540" y="484" class="label">OLED</text>
  <text x="540" y="504" class="small">SSD1306 I2C</text>

  <rect x="350" y="610" width="90" height="60" fill="#fef3c7" class="module"/>
  <text x="365" y="637" class="label">Boton</text>
  <text x="365" y="657" class="pin">GPIO14</text>

  <!-- TFT connector on internal board -->
  <rect x="500" y="705" width="135" height="80" fill="#ffffff" class="module"/>
  <text x="522" y="732" class="label">J-TFT</text>
  <text x="515" y="752" class="small">conector a tapa</text>
  <text x="512" y="774" class="pin">VCC GND CLK MOSI CS DC RST LED</text>

  <!-- Lid area with TFT mounted -->
  <rect x="745" y="115" width="575" height="360" class="lid"/>
  <text x="765" y="145" class="label">Tapa de la caja - cara interior</text>
  <text x="765" y="166" class="small">La TFT no ocupa la PCB: va atornillada o pegada a separadores en la tapa.</text>
  <rect x="865" y="190" width="355" height="240" fill="#111827" class="module"/>
  <rect x="905" y="220" width="275" height="165" class="cutout"/>
  <text x="948" y="212" class="label" fill="#ffffff">TFT ILI9342 2.8"</text>
  <text x="940" y="410" class="small" fill="#ffffff">pantalla visible por ventana frontal</text>
  <circle cx="885" cy="210" r="9" fill="#e5e7eb" stroke="#111827"/>
  <circle cx="1200" cy="210" r="9" fill="#e5e7eb" stroke="#111827"/>
  <circle cx="885" cy="410" r="9" fill="#e5e7eb" stroke="#111827"/>
  <circle cx="1200" cy="410" r="9" fill="#e5e7eb" stroke="#111827"/>
  <rect x="1000" y="438" width="90" height="24" fill="#ffffff" stroke="#111827"/>
  <text x="1013" y="455" class="pin">J-TFT</text>

  <!-- Ribbon cable -->
  <path d="M635 745 C720 735 760 620 835 510 C905 405 975 465 1045 450" class="ribbon"/>
  <path d="M635 745 C720 735 760 620 835 510 C905 405 975 465 1045 450" class="wirespi"/>
  <text x="720" y="665" class="small">cinta/mazo corto hacia tapa</text>

  <!-- Internal signal wires -->
  <path d="M325 330 C360 310 360 235 380 235" class="wireuart1"/>
  <path d="M325 355 C360 350 360 260 380 260" class="wireuart2"/>
  <path d="M325 385 C360 390 365 350 390 350" class="wireuart1"/>
  <path d="M325 410 C355 420 365 380 390 380" class="wireuart2"/>
  <path d="M325 455 C365 465 390 500 410 510" class="wirei2c"/>
  <path d="M325 475 C380 480 500 490 520 495" class="wirei2c"/>
  <path d="M325 510 C355 560 365 610 380 625" class="wirectrl"/>
  <path d="M325 535 C385 600 455 700 500 735" class="wirespi"/>
  <path d="M325 555 C395 625 455 720 500 755" class="wirectrl"/>

  <!-- Legend and wiring table -->
  <rect x="745" y="500" width="575" height="355" class="legend"/>
  <text x="770" y="540" class="title">Conector recomendado a tapa</text>
  <text x="770" y="575" class="small">Usar JST-XH/PH, Dupont bloqueado o IDC de 8-10 vias. Mantener el mazo corto.</text>
  <text x="770" y="610" class="pin">1  VCC TFT        -> +5V o 3V3 segun modulo TFT</text>
  <text x="770" y="630" class="pin">2  GND            -> GND comun</text>
  <text x="770" y="650" class="pin">3  CLK/SCK        -> ESP32 GPIO18</text>
  <text x="770" y="670" class="pin">4  MOSI/SDI       -> ESP32 GPIO23</text>
  <text x="770" y="690" class="pin">5  CS             -> ESP32 GPIO4</text>
  <text x="770" y="710" class="pin">6  DC             -> ESP32 GPIO2</text>
  <text x="770" y="730" class="pin">7  RESET          -> ESP32 GPIO0</text>
  <text x="770" y="750" class="pin">8  LED/backlight  -> ESP32 GPIO15 PWM</text>
  <text x="770" y="770" class="pin">9  SDO/MISO       -> opcional, sin usar en YAML</text>
  <text x="770" y="790" class="pin">10 Touch/IRQ      -> opcional, sin usar en YAML actual</text>

  <rect x="770" y="815" width="525" height="28" class="note"/>
  <text x="785" y="834" class="small">Para SPI por cable: GND junto a CLK/MOSI ayuda a reducir ruido. Evitar cables largos.</text>

  <!-- Main board wiring summary -->
  <rect x="70" y="885" width="1250" height="65" class="legend"/>
  <line x1="95" y1="910" x2="145" y2="910" class="wireuart1"/><text x="155" y="915" class="small">UART RX</text>
  <line x1="230" y1="910" x2="280" y2="910" class="wireuart2"/><text x="290" y="915" class="small">UART TX</text>
  <line x1="365" y1="910" x2="415" y2="910" class="wirei2c"/><text x="425" y="915" class="small">I2C</text>
  <line x1="500" y1="910" x2="550" y2="910" class="wirespi"/><text x="560" y="915" class="small">SPI a TFT en tapa</text>
  <line x1="695" y1="910" x2="745" y2="910" class="wirectrl"/><text x="755" y="915" class="small">control/backlight/boton</text>
  <text x="95" y="940" class="small">PMSA003: GPIO16/17. CM1106: GPIO33/32. I2C: GPIO21/22. Boton: GPIO14 a GND. Backlight TFT: GPIO15.</text>
</svg>
