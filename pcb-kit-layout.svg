      .wirectrl { stroke: #be123c; stroke-width: 3; fill: none; }
      .legend { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; rx: 8; ry: 8; }
    </style>
  </defs>

  <text x="50" y="45" class="title">AirQ32-W - propuesta de montaje en PCB kit / placa universal</text>
  <text x="50" y="72" class="sub">Vista superior orientativa. Escala aproximada: placa 100 x 160 mm, basada en aqi32-w.yaml y dimensiones de los modulos.</text>

  <!-- Board -->
  <rect x="70" y="105" width="760" height="760" class="board"/>
  <text x="80" y="98" class="small">PCB universal 100 x 160 mm</text>

