  <!-- Power rails -->
  <line x1="95" y1="128" x2="805" y2="128" class="wire5"/>
  <text x="105" y="122" class="small">rail +5V</text>
  <line x1="95" y1="850" x2="805" y2="850" class="wireg"/>
  <text x="105" y="842" class="small">rail GND</text>
  <line x1="95" y1="155" x2="805" y2="155" class="wire33"/>
  <text x="105" y="150" class="small">rail +3V3</text>

  <!-- Modules -->
  <rect x="115" y="205" width="215" height="390" fill="#93c5fd" class="module"/>
  <text x="140" y="235" class="label">ESP32 DevKit V4</text>
  <text x="140" y="255" class="small">USB hacia borde inferior</text>
  <rect x="185" y="558" width="75" height="28" fill="#d1d5db" stroke="#111827"/>
  <text x="193" y="578" class="small">USB</text>

  <rect x="438" y="145" width="355" height="610" fill="#111827" class="module"/>
  <rect x="468" y="205" width="295" height="435" class="screen"/>
  <text x="520" y="180" class="label" fill="#ffffff">TFT ILI9342 2.8"</text>
  <text x="560" y="665" class="small" fill="#ffffff">50 x 86 mm</text>
  <text x="470" y="730" class="pin" fill="#ffffff">VCC GND RESET CS SDI SCK LED SDO T_CLK T_CS T_DIN T_DO IRQ</text>

  <rect x="95" y="635" width="255" height="175" fill="#e0f2fe" class="module"/>
  <text x="120" y="665" class="label">PMSA003</text>
  <text x="120" y="685" class="small">Toma/salida de aire al borde izquierdo</text>
  <text x="120" y="705" class="small">38 x 35 mm</text>
  <rect x="95" y="692" width="30" height="70" fill="#bfdbfe" stroke="#111827"/>
  <text x="128" y="790" class="pin">1=5V 2=5V 3=GND 4=GND 5=NC 6=NC 7=RX 8=SET 9=TX 10=RESET</text>

  <rect x="585" y="785" width="210" height="70" fill="#fde68a" class="module"/>
  <text x="605" y="815" class="label">CM1106SL-NS CO2</text>
  <text x="605" y="835" class="small">Ventanas al exterior de caja</text>
  <text x="605" y="852" class="small">33.5 x 19.7 mm</text>

  <rect x="360" y="770" width="80" height="95" fill="#ddd6fe" class="module"/>
  <text x="374" y="798" class="label">BME280</text>
  <text x="374" y="817" class="small">lejos de calor</text>
  <text x="374" y="837" class="pin">VIN GND SCL SDA</text>

  <rect x="345" y="180" width="70" height="60" fill="#fef3c7" class="module"/>
  <text x="356" y="205" class="label">Boton</text>
  <text x="356" y="225" class="pin">GPIO14</text>

  <rect x="345" y="260" width="70" height="90" fill="#f3f4f6" class="module"/>
  <text x="356" y="286" class="label">OLED</text>
  <text x="356" y="306" class="small">SSD1306</text>
  <text x="356" y="326" class="pin">I2C</text>

  <!-- Wiring, stylized routes -->
  <path d="M330 315 C380 315 390 300 438 300" class="wirespi"/>
  <path d="M330 340 C385 350 400 370 438 370" class="wirespi"/>
  <path d="M330 365 C385 400 400 430 438 430" class="wirespi"/>
  <path d="M330 390 C380 440 398 510 438 510" class="wirectrl"/>
  <path d="M330 415 C375 475 395 575 438 575" class="wirectrl"/>
  <path d="M330 445 C370 500 390 620 438 620" class="wirectrl"/>

  <path d="M225 595 C225 615 225 625 225 635" class="wireuart1"/>
  <path d="M250 595 C260 620 280 625 300 635" class="wireuart2"/>
  <path d="M315 760 C345 775 350 805 360 815" class="wirei2c"/>
  <path d="M315 730 C420 745 505 770 585 815" class="wireuart1"/>
  <path d="M315 710 C430 720 510 780 585 835" class="wireuart2"/>
  <path d="M330 290 C340 275 350 245 360 230" class="wirectrl"/>
  <path d="M330 270 C340 265 350 310 360 315" class="wirei2c"/>

  <!-- Labels beside routes -->
  <text x="835" y="128" class="small">+5V: VIN ESP32, PMSA003, TFT VCC/LED si modulo acepta 5V</text>
  <text x="835" y="155" class="small">+3V3: BME280 si es modulo 3.3V; logica I2C/SPI a 3.3V</text>
  <text x="835" y="850" class="small">GND comun para todos los modulos</text>

  <!-- Legend and wiring table -->
  <rect x="875" y="105" width="475" height="760" class="legend"/>
  <text x="900" y="145" class="title">Conexiones segun YAML</text>

  <text x="900" y="185" class="label">PMSA003 - UART PM</text>
  <text x="900" y="210" class="pin">PMS pin 1/2 VCC  -> +5V</text>
  <text x="900" y="230" class="pin">PMS pin 3/4 GND  -> GND</text>
  <text x="900" y="250" class="pin">PMS TX pin 9     -> ESP32 GPIO16 RX</text>
  <text x="900" y="270" class="pin">PMS RX pin 7     -> ESP32 GPIO17 TX</text>
  <text x="900" y="290" class="pin">PMS SET/RESET    -> no usados en YAML</text>

  <text x="900" y="335" class="label">CM1106SL-NS - UART CO2</text>
  <text x="900" y="360" class="pin">CM VCC           -> +5V recomendado</text>
  <text x="900" y="380" class="pin">CM GND           -> GND</text>
  <text x="900" y="400" class="pin">CM TX            -> ESP32 GPIO33 RX</text>
  <text x="900" y="420" class="pin">CM RX            -> ESP32 GPIO32 TX</text>

  <text x="900" y="465" class="label">BME280 y OLED SSD1306 - I2C</text>
  <text x="900" y="490" class="pin">SDA              -> ESP32 GPIO21</text>
  <text x="900" y="510" class="pin">SCL              -> ESP32 GPIO22</text>
  <text x="900" y="530" class="pin">BME address      -> 0x76</text>
  <text x="900" y="550" class="pin">Alimentacion     -> 3V3 o VIN segun modulo</text>

  <text x="900" y="595" class="label">TFT ILI9342 - SPI</text>
  <text x="900" y="620" class="pin">SCK/CLK          -> ESP32 GPIO18</text>
  <text x="900" y="640" class="pin">MOSI/SDI         -> ESP32 GPIO23</text>
  <text x="900" y="660" class="pin">CS               -> ESP32 GPIO4</text>
  <text x="900" y="680" class="pin">DC               -> ESP32 GPIO2</text>
  <text x="900" y="700" class="pin">RESET            -> ESP32 GPIO0</text>
  <text x="900" y="720" class="pin">LED/backlight    -> ESP32 GPIO15 PWM</text>
  <text x="900" y="740" class="pin">MISO/SDO         -> sin usar en YAML</text>

  <text x="900" y="785" class="label">Boton</text>
  <text x="900" y="810" class="pin">GPIO14 -> boton -> GND, INPUT_PULLUP invertido</text>

  <text x="900" y="845" class="small">Nota: dejar separacion y aberturas de aire en PMS/CO2/BME; no cubrir tomas.</text>

  <!-- color key -->
  <rect x="70" y="890" width="760" height="65" class="legend"/>
  <line x1="95" y1="912" x2="145" y2="912" class="wireuart1"/><text x="155" y="917" class="small">UART RX</text>
  <line x1="230" y1="912" x2="280" y2="912" class="wireuart2"/><text x="290" y="917" class="small">UART TX</text>
  <line x1="365" y1="912" x2="415" y2="912" class="wirei2c"/><text x="425" y="917" class="small">I2C</text>
  <line x1="500" y1="912" x2="550" y2="912" class="wirespi"/><text x="560" y="917" class="small">SPI TFT</text>
  <line x1="635" y1="912" x2="685" y2="912" class="wirectrl"/><text x="695" y="917" class="small">control/backlight/boton</text>
  <text x="95" y="943" class="small">Colocar conectores desmontables JST/Dupont para PMSA003 y CM1106 facilita mantenimiento y orientacion de aire.</text>
</svg>
